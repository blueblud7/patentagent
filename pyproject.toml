[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patent-copilot"
version = "0.1.0"
description = "MCP server for prior art search and evidence-grounded patent claim charts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "patent-copilot contributors" }
]
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[project.scripts]
patent-copilot = "patent_copilot.server:main"
patent-copilot-demo = "patent_copilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
